[package]
name = "acer-broker"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Historical code only. Excluded from the core product; no RPC is registered.
calibration-research = []

[[example]]
name = "calibration_worker_idle"
required-features = ["calibration-research"]

[dependencies]
acer-protocol = { path = "../acer-protocol" }
acer-device = { path = "../acer-device" }
acer-controls = { path = "../acer-controls" }
acer-system = { path = "../acer-system" }
acer-boot-logo = { path = "../acer-boot-logo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "acer-helper"
path = "src/main.rs"
